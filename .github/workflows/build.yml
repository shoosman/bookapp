name: Build APK

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log || {
            # Ошибки компиляции — в аннотации, чтобы их было видно без логов
            grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Prepare files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/chtets.apk
          cp out/chtets.apk "out/Chtets-0.1.${GITHUB_RUN_NUMBER}.apk"
          NOTES="$(git log -1 --pretty=%s)"
          SIZE=$(stat -c %s out/chtets.apk)
          jq -n --argjson code "$GITHUB_RUN_NUMBER" --arg name "0.1.${GITHUB_RUN_NUMBER}" \
                --arg notes "$NOTES" --argjson size "$SIZE" \
                '{versionCode: $code, versionName: $name, notes: $notes, size: $size}' > out/version.json
          cat out/version.json

      # Релиз версии — для истории
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" "out/Chtets-0.1.${GITHUB_RUN_NUMBER}.apk" \
            --title "Чтец 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)"

      # Постоянный релиз `latest` — отсюда приложение берёт обновления
      - name: Update latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Обновления" \
              --notes "Служебный релиз: отсюда Чтец скачивает обновления."
          gh release upload latest out/chtets.apk out/version.json --clobber
